name: Deploy course site

# Three-repo publish: this (private src) repo builds site/ and pushes the built
# site to the gh-pages branch of the PUBLIC site repo (schoolofdevops/402-mlops-site).
# Setup (once): create a fine-grained PAT with contents:write on schoolofdevops/402-mlops-site
# and add it to this repo's Actions secrets as DEPLOY_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build site & publish to schoolofdevops/402-mlops-site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to the public site repo (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: schoolofdevops/402-mlops-site
          publish_branch: gh-pages
          # path is relative to the repo root (not the job working-directory)
          publish_dir: site/build
